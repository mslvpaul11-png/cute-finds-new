<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cute Finds | Discover Your Next Favourite</title>
<style>
:root{--bg:#faf8f4;--ink:#302b26;--muted:#81776c;--line:#e9e2d8;--accent:#a58b70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
header{padding:25px 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-family:Georgia,serif;font-size:30px}
header a{color:var(--ink);text-decoration:none;font-size:14px}
.hero{text-align:center;padding:65px 20px 40px}
.hero h1{font-family:Georgia,serif;font-size:clamp(32px,5vw,52px);font-weight:normal;margin:0 0 15px}
.hero p{color:var(--muted);line-height:1.7}
.search{display:block;width:min(440px,90%);margin:25px auto;padding:14px 17px;border:1px solid var(--line);border-radius:30px;background:white;font-size:15px}
.categories{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px 15px 30px}
.categories button{border:1px solid var(--line);background:white;border-radius:25px;padding:10px 17px;cursor:pointer;color:var(--ink)}
.categories button.active{background:var(--ink);color:white}
main{max-width:1250px;margin:auto;padding:15px 5% 60px}
.section-title{text-align:center;font:normal 29px Georgia,serif;margin:15px 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:25px}
.card{background:white;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#eee}
.details{padding:15px}
.details h3{font:normal 19px Georgia,serif;margin:0 0 8px}
.details p{font-size:13px;color:var(--muted);line-height:1.5;min-height:35px}
.price{font-weight:bold;margin:12px 0}
.shop{display:block;text-align:center;background:var(--ink);color:white;text-decoration:none;padding:12px;border-radius:5px;font-size:14px}
.message{text-align:center;padding:35px;color:var(--muted)}
footer{text-align:center;padding:35px 15px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer a{color:inherit;margin:0 8px}
</style>
</head>
<body><header>
  <div class="logo">Cute Finds</div>
  <a href="admin.html">Admin</a>
</header><section class="hero">
  <h1>Little Finds, Big Happiness</h1>
  <p>Discover beautiful things for your home, lifestyle and everyday moments.</p>
  <input class="search" id="search" type="search" placeholder="Search your favourite finds...">
</section><nav class="categories" id="categories">
  <button class="active" data-category="All">All</button>
  <button data-category="Home Decor">Home Decor</button>
  <button data-category="Fashion">Fashion</button>
  <button data-category="Beauty">Beauty</button>
  <button data-category="Kitchen">Kitchen</button>
  <button data-category="Electronics">Electronics</button>
  <button data-category="Lifestyle">Lifestyle</button>
  <button data-category="Accessories">Accessories</button>
</nav><main>
  <h2 class="section-title">Our Favourite Finds</h2>
  <div id="productGrid" class="grid">
    <div class="message">Loading products...</div>
  </div>
</main><footer>
  <p>Made with love · Cute Finds</p>
  <a href="https://pin.it/4zPwNDqNF" target="_blank" rel="noopener">Pinterest</a>
  <p>As an Amazon Associate, we earn from qualifying purchases.</p>
</footer><script>
const API_URL="https://script.google.com/macros/s/AKfycbyLJovLqOpOTpfJ1DYBAM-OCTePOxct0_nl30a5IodWzzzjgSzzD86dILIYawkdrjqt/exec";

let products=[];
let selectedCategory="All";

function loadProducts(){
  const callback="cuteFindsStore_"+Date.now();
  const script=document.createElement("script");
  const url=new URL(API_URL);

  url.searchParams.set("action","products");
  url.searchParams.set("callback",callback);
  url.searchParams.set("_",Date.now());

  const timeout=setTimeout(()=>{
    delete window[callback];
    script.remove();
    document.getElementById("productGrid").innerHTML=
      '<div class="message">Could not load products. Please refresh the page.</div>';
  },15000);

  window[callback]=(data)=>{
    clearTimeout(timeout);
    delete window[callback];
    script.remove();

    if(!data || !data.success){
      document.getElementById("productGrid").innerHTML=
        '<div class="message">Unable to load products right now.</div>';
      return;
    }

    products=Array.isArray(data.products)?data.products:[];
    renderProducts();
  };

  script.onerror=()=>{
    clearTimeout(timeout);
    delete window[callback];
    script.remove();
    document.getElementById("productGrid").innerHTML=
      '<div class="message">Connection error. Please refresh the page.</div>';
  };

  script.src=url.toString();
  document.head.appendChild(script);
}

function renderProducts(){
  const grid=document.getElementById("productGrid");
  const search=document.getElementById("search").value.toLowerCase().trim();

  const filtered=products.filter(p=>{
    const matchesCategory=selectedCategory==="All" || p.category===selectedCategory;
    const matchesSearch=(p.name+" "+p.description+" "+p.category).toLowerCase().includes(search);
    return matchesCategory && matchesSearch;
  });

  if(!filtered.length){
    grid.innerHTML='<div class="message">No products found. Check back soon!</div>';
    return;
  }

  grid.innerHTML="";

  filtered.forEach(p=>{
    const card=document.createElement("article");
    card.className="card";

    const img=document.createElement("img");
    img.src=p.imageUrl || "";
    img.alt=p.name || "Product";
    img.loading="lazy";
    img.onerror=()=>{img.style.display="none"};

    const details=document.createElement("div");
    details.className="details";

    const name=document.createElement("h3");
    name.textContent=p.name || "Untitled product";

    const description=document.createElement("p");
    description.textContent=p.description || p.category || "";

    const price=document.createElement("div");
    price.className="price";
    price.textContent=p.price || "";

    const link=document.createElement("a");
    link.className="shop";
    link.textContent="Shop Now";
    link.href=p.affiliateUrl || "#";
    link.target="_blank";
    link.rel="noopener sponsored";

    details.append(name,description,price,link);
    card.append(img,details);
    grid.appendChild(card);
  });
}

document.getElementById("search").addEventListener("input",renderProducts);

document.getElementById("categories").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;

  selectedCategory=e.target.dataset.category;

  document.querySelectorAll(".categories button").forEach(btn=>{
    btn.classList.toggle("active",btn===e.target);
  });

  renderProducts();
});

loadProducts();
</script></body>
</html>
