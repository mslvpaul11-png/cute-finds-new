<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cute Finds | Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 14px;background:#f7f4ee;color:#302b26;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:20px auto;background:#fffdf9;padding:26px;border:1px solid #e4ddd3;border-radius:12px}h1{font:normal 34px Georgia,serif;text-align:center;margin:5px}.sub{text-align:center;color:#756d63}label{display:block;margin:15px 0 6px;font-size:14px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8cfc4;border-radius:6px;font:inherit;background:white}textarea{min-height:80px}button{border:0;border-radius:6px;background:#75634f;color:white;padding:12px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.wide{width:100%;margin-top:16px}.secondary{background:#8c8174}.danger{background:#9a5148;padding:8px 12px}.status{display:none;margin:14px 0;padding:12px;border-radius:6px;line-height:1.5;overflow-wrap:anywhere}.status.show{display:block}.ok{background:#eaf3e8;color:#315b35}.bad{background:#fbe9e7;color:#963b32}.info{background:#f2eee7;color:#675947}.note{font-size:12px;color:#756d63;line-height:1.5}.product{display:flex;gap:14px;align-items:center;border-top:1px solid #eee5da;padding:12px 0}.product img{width:65px;height:65px;object-fit:cover;border-radius:6px}.product .meta{flex:1;min-width:0}.product strong{display:block}.product small{color:#756d63}.row{display:flex;gap:10px}.row>*{flex:1}#panel{display:none}@media(max-width:520px){.wrap{padding:18px}.row{display:block}.product{align-items:flex-start}}
</style></head><body><main class="wrap"><h1>Cute Finds</h1><p class="sub">Admin Product Dashboard</p>
<div id="login"><p class="sub">Sign in with your authorized Google account.</p><button class="wide" id="loginBtn">Sign in with Google</button></div>
<section id="panel"><p id="userInfo" class="sub"></p><form id="productForm">
<label for="name">Product name *</label><input id="name" required maxlength="160" placeholder="Ivory Ceramic Table Lamp">
<label for="category">Category *</label><select id="category" required><option value="">Choose a category</option><option>Home Decor</option><option>Fashion</option><option>Beauty</option><option>Kitchen</option><option>Electronics</option><option>Lifestyle</option><option>Accessories</option><option>Other</option></select>
<label for="description">Description</label><textarea id="description" maxlength="1000"></textarea>
<div class="row"><div><label for="price">Price</label><input id="price" maxlength="50" placeholder="$29.99"></div><div><label for="active">Visibility</label><select id="active"><option value="true">Visible on website</option><option value="false">Hidden</option></select></div></div>
<label for="affiliateUrl">Amazon affiliate link *</label><input id="affiliateUrl" type="url" required placeholder="https://www.amazon...">
<label for="image">Product image <span id="imageRequired">*</span></label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><p class="note">JPG, PNG or WebP. Choose an image under 2 MB. When editing, leave this blank to keep the existing image.</p>
<button class="wide" id="saveBtn" type="submit">Save Product</button><button class="wide secondary" id="cancelEdit" type="button" hidden>Cancel edit</button>
</form><h2 style="font:normal 24px Georgia,serif;margin-top:30px">Your products</h2><div id="productList" class="note">Loading products…</div><button class="wide secondary" id="logoutBtn">Sign out</button></section>
<div id="status" class="status" role="status" aria-live="polite"></div><p class="note"><a href="index.html">← Back to storefront</a></p></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyB2iH6w2TJsPQs8TX9ZykJ7zAzfz1Fi-dM",authDomain:"cute-finds-admin.firebaseapp.com",projectId:"cute-finds-admin",storageBucket:"cute-finds-admin.firebasestorage.app",messagingSenderId:"161451262975",appId:"1:161451262975:web:8870d4fd6e506dabc15dca"};
const ADMIN_EMAIL="mslvpaul.11@gmail.com";
const API_URL="https://script.google.com/macros/s/AKfycbyLJovLqOpOTpfJ1DYBAM-OCTePOxct0_nl30a5IodWzzzjgSzzD86dILIYawkdrjqt/exec";
const auth=getAuth(initializeApp(firebaseConfig)),provider=new GoogleAuthProvider(),$=id=>document.getElementById(id);let editingId=null,products=[];
function showStatus(message,type="info"){$("status").textContent=message;$("status").className="status show "+type}function clearStatus(){$("status").textContent="";$("status").className="status"}
function jsonp(params){return new Promise((resolve,reject)=>{const cb="cuteFinds_"+crypto.randomUUID().replace(/-/g,""),script=document.createElement("script"),url=new URL(API_URL);url.search=new URLSearchParams({...params,callback:cb,_:Date.now()});const timer=setTimeout(()=>finish(Error("Backend request timed out.")),15000);function finish(err,value){clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(value)}window[cb]=value=>finish(null,value);script.onerror=()=>finish(Error("Could not connect to the backend. Check the Apps Script deployment."));script.src=url.toString();document.head.appendChild(script)})}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function sendRequest(action,product){const user=auth.currentUser;if(!user)throw Error("Please sign in again.");const requestId=crypto.randomUUID().replace(/-/g,"");const payload={action,requestId,token:await user.getIdToken(true),product};await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:new URLSearchParams({payload:JSON.stringify(payload)})});for(let i=0;i<20;i++){await wait(1500);const result=await jsonp({action:"status",requestId});if(result.pending)continue;if(result.success)return result;throw Error(result.error||"The backend could not complete the request.")}throw Error("No confirmation received. Check the Products sheet before trying again.")}
function fileBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]);reader.onerror=()=>reject(Error("Could not read the image."));reader.readAsDataURL(file)})}
async function compressImage(file){const data=await createImageBitmap(file);const scale=Math.min(1,1400/Math.max(data.width,data.height));const canvas=document.createElement("canvas");canvas.width=Math.round(data.width*scale);canvas.height=Math.round(data.height*scale);canvas.getContext("2d").drawImage(data,0,0,canvas.width,canvas.height);return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(Error("Image processing failed.")),"image/jpeg",0.82))}
async function loadProducts(){const data=await jsonp({action:"products"});if(!data.success)throw Error(data.error||"Could not load products.");products=data.products||[];renderProducts()}
function renderProducts(){const list=$("productList");if(!products.length){list.textContent="No products yet.";return}list.innerHTML="";products.forEach(p=>{const item=document.createElement("div");item.className="product";const img=document.createElement("img");img.src=p.imageUrl;img.alt="";const meta=document.createElement("div");meta.className="meta";const title=document.createElement("strong");title.textContent=p.name;const detail=document.createElement("small");detail.textContent=(p.category||"Other")+" · "+(p.active?"Visible":"Hidden");meta.append(title,detail);const edit=document.createElement("button");edit.className="secondary";edit.textContent="Edit";edit.onclick=()=>editProduct(p);const del=document.createElement("button");del.className="danger";del.textContent="Delete";del.onclick=()=>deleteProduct(p);item.append(img,meta,edit,del);list.append(item)})}
function editProduct(p){editingId=p.id;$("name").value=p.name;$("category").value=p.category;$("description").value=p.description;$("price").value=p.price;$("affiliateUrl").value=p.affiliateUrl;$("active").value=String(p.active);$("image").required=false;$("imageRequired").textContent="(optional while editing)";$("saveBtn").textContent="Update Product";$("cancelEdit").hidden=false;window.scrollTo({top:0,behavior:"smooth"});showStatus("Editing: "+p.name,"info")}
function resetForm(){$("productForm").reset();editingId=null;$("image").required=true;$("imageRequired").textContent="*";$("saveBtn").textContent="Save Product";$("cancelEdit").hidden=true}
async function deleteProduct(p){if(!confirm("Delete '"+p.name+"'?"))return;try{showStatus("Deleting product…");await sendRequest("delete",{id:p.id});await loadProducts();showStatus("Product deleted.","ok")}catch(err){showStatus(err.message,"bad")}}
$("loginBtn").onclick=async()=>{clearStatus();try{await signInWithPopup(auth,provider)}catch(err){showStatus("Google sign-in failed: "+err.message,"bad")}};
$("logoutBtn").onclick=()=>signOut(auth);
$("cancelEdit").onclick=()=>{resetForm();clearStatus()};
onAuthStateChanged(auth,async user=>{if(user&&user.email?.toLowerCase()===ADMIN_EMAIL){$("login").style.display="none";$("panel").style.display="block";$("userInfo").textContent="Signed in as "+user.email;try{await loadProducts();clearStatus()}catch(err){showStatus(err.message,"bad")}}else{$("panel").style.display="none";$("login").style.display="block";if(user){await signOut(auth);showStatus("Access denied. Use the authorized admin Google account.","bad")}}});
$("productForm").addEventListener("submit",async event=>{event.preventDefault();clearStatus();const file=$("image").files[0];if(!editingId&&!file){showStatus("Please choose a product image.","bad");return}if(file&&file.size>8*1024*1024){showStatus("Please choose an image smaller than 8 MB before compression.","bad");return}const button=$("saveBtn");button.disabled=true;button.textContent="Saving…";try{const product={id:editingId||"",name:$("name").value.trim(),category:$("category").value,description:$("description").value.trim(),price:$("price").value.trim(),affiliateUrl:$("affiliateUrl").value.trim(),active:$("active").value==="true"};if(file){const blob=await compressImage(file);product.imageBase64=await fileBase64(blob);product.mimeType="image/jpeg";product.fileName="product.jpg"}const result=await sendRequest("save",product);resetForm();await loadProducts();showStatus(result.message||"Product saved successfully.","ok")}catch(err){showStatus("Save failed: "+err.message,"bad")}finally{button.disabled=false;button.textContent=editingId?"Update Product":"Save Product"}});
</script></body></html>
